name: Docker Build and Push

on:
  push:
    branches:
      - docker
  workflow_dispatch:

env:
  REPO: cronos-labs/cronos-zkevm
  BRANCH_NAME: cronos_core-v29.14.0
  BASE_IMAGE_TAG: v29.14.0
  IMAGE_TAG: v29.14.0

jobs:
  build-and-push:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-22.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Initial checkout for Dockerfile and scripts
        uses: actions/checkout@v4

      - name: Save build files
        run: |
          mkdir -p /tmp/build-files
          cp Dockerfile /tmp/build-files/
          cp generate_secrets.sh /tmp/build-files/

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          ref: ${{ env.BRANCH_NAME }}

      - name: Restore build files
        run: |
          cp /tmp/build-files/Dockerfile ./
          mkdir -p backups
          cp /tmp/build-files/generate_secrets.sh ./backups/generate_secrets.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io/cronos-labs
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/cronos-labs/external-node:${{ env.IMAGE_TAG }}-${{ matrix.arch }}
          file: Dockerfile
          build-args: |
            BASE_IMAGE_TAG=${{ env.BASE_IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io/cronos-labs
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker buildx imagetools create -t ghcr.io/cronos-labs/external-node:${{ env.IMAGE_TAG }} \
            ghcr.io/cronos-labs/external-node:${{ env.IMAGE_TAG }}-amd64 \
            ghcr.io/cronos-labs/external-node:${{ env.IMAGE_TAG }}-arm64
